name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PROVIDER_RUST_TOOLCHAIN: "1.98.1"
  PROVIDER_MSRV: "1.98.1"
  WASM_TOOLS_VERSION: "1.259.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `--component clippy rustfmt` reads the second name as a toolchain, not a component, so
      # both names need their own flag. `rustup override set` is what makes the pin real: without
      # it the toolchain is installed and then every cargo step below runs on the runner default.
      - run: |
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal \
            --component clippy --component rustfmt
          rustup toolchain install "$PROVIDER_MSRV" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$PROVIDER_RUST_TOOLCHAIN"
          rustup override set "$PROVIDER_RUST_TOOLCHAIN"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The MSRV is a claim in Cargo.toml; an unchecked claim is a wish.
      - run: cargo "+$PROVIDER_MSRV" check --locked --all-targets
      # The component is what ships; a crate that only compiles natively is not evidence.
      - run: cargo check --locked --target wasm32-unknown-unknown

  component:
    name: Reproducible component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$PROVIDER_RUST_TOOLCHAIN"
          cargo install wasm-tools --version "$WASM_TOOLS_VERSION" --locked

      # The WIT in this repository is a mirror of dekopon's. Out of tree there is no shared file to
      # keep them honest, so fetch the originals from the exact source Cargo.lock resolved and
      # compare. An interface change upstream fails here loudly, rather than producing a component
      # that mismatches the host it will be loaded into.
      #
      # The pin is a git rev today and becomes tag `v0.13.0` when the SDK publishes, so this reads
      # the `source` line and handles both: `?rev=<sha>` names a commit, a registry source names the
      # release tag derived from the version. Either way the reference comes out of Cargo.lock, which
      # is what cargo actually built against, so the two cannot skew.
      - name: Check the WIT mirrors against the pinned dekopon source
        run: |
          set -euo pipefail
          field() {
            sed -n "/^name = \"$1\"\$/,/^\$/s/^$2 = \"\(.*\)\"\$/\1/p" Cargo.lock | head -1
          }
          sdk_version=$(field dekopon-provider-sdk version)
          http_version=$(field dekopon-provider-http version)
          sdk_source=$(field dekopon-provider-sdk source)
          http_source=$(field dekopon-provider-http source)
          test -n "$sdk_version"
          # The two are published from one workspace at one version, and a provider that mixed them
          # would carry one crate's WIT and the other's bindings. If they ever skew, the WIT fetched
          # below matches only one of them and this check proves nothing.
          if [ "$sdk_version" != "$http_version" ] || [ "$sdk_source" != "$http_source" ]; then
            echo "the SDK and HTTP pins disagree:" >&2
            echo "  sdk  $sdk_version $sdk_source" >&2
            echo "  http $http_version $http_source" >&2
            exit 1
          fi
          case "$sdk_source" in
            *"?rev="*)
              reference=${sdk_source##*\?rev=}
              reference=${reference%%#*}
              echo "pinned dekopon commit: $reference"
              ;;
            registry+*)
              reference="v$sdk_version"
              echo "pinned dekopon release: $reference"
              ;;
            *)
              echo "unrecognized dekopon source: $sdk_source" >&2
              exit 1
              ;;
          esac
          base="https://raw.githubusercontent.com/dekopon-agents/dekopon/$reference"
          curl -fsSL "$base/crates/dekopon-provider-sdk/wit/provider.wit" -o "$RUNNER_TEMP/provider.wit"
          curl -fsSL "$base/wit/http/http.wit" -o "$RUNNER_TEMP/http.wit"
          cmp "$RUNNER_TEMP/provider.wit" wit/deps/provider.wit
          cmp "$RUNNER_TEMP/http.wit" wit/deps/http.wit

      - name: Build the component
        run: ./build.sh

      # Determinism is the property the harness exists for, so assert it rather than trust it. The
      # second build is an independent source copy with its own ordinary default `target/`: pointing
      # two builds at one CARGO_TARGET_DIR would serialize them on Cargo's build-directory lock and
      # prove less.
      - name: Rebuild independently and compare bytes
        run: |
          set -euo pipefail
          rsync -a --exclude target/ --exclude .git/ --exclude 'gpt-image-provider.wasm*' \
            ./ "$RUNNER_TEMP/rebuild/"
          (cd "$RUNNER_TEMP/rebuild" && ./build.sh)
          cmp gpt-image-provider.wasm "$RUNNER_TEMP/rebuild/gpt-image-provider.wasm"
          cmp gpt-image-provider.wasm.sha256 "$RUNNER_TEMP/rebuild/gpt-image-provider.wasm.sha256"

      # A provider that reaches the outside world through anything but its declared imports is not
      # sandboxed by the broker. These three are the ambient escape hatches wasm32 makes available.
      - name: Reject ambient dependencies
        run: |
          set -euo pipefail
          cargo tree --locked --target wasm32-unknown-unknown --edges normal,build > deps.tree
          if grep -Eqi '(^|[[:space:]])(wasm-bindgen|js-sys|wasi)([[:space:]]|$)' deps.tree; then
            echo "forbidden ambient dependency" >&2
            grep -Ein '(^|[[:space:]])(wasm-bindgen|js-sys|wasi)([[:space:]]|$)' deps.tree >&2
            exit 1
          fi

      - name: Inspect the component
        run: |
          set -euo pipefail
          core=target/wasm32-unknown-unknown/release/dekopon_gpt_image_provider.wasm
          test -s "$core"
          wasm-tools validate "$core"
          wasm-tools validate gpt-image-provider.wasm
          # The release profile sets `strip = "symbols"`, which also drops the core module's
          # `producers` section, so provenance is asserted on the component: wit-component writes
          # its own `producers` entry naming wit-bindgen-rust, and that one survives the strip.
          # Written to a file first, as scripts/validate.sh does: under `pipefail`, `| grep -q`
          # exits on the first match and the SIGPIPE it sends wasm-tools fails the pipeline.
          wasm-tools metadata show gpt-image-provider.wasm > component-metadata.txt
          grep -F 'wit-bindgen-rust' component-metadata.txt > /dev/null
          # This provider reaches chatgpt.com through the broker's HTTP client and nothing else. Any
          # other core import is a new authority nobody reviewed.
          wasm-tools print "$core" | grep '(import ' > core-imports.txt || true
          test -s core-imports.txt
          if grep -Fv 'dekopon:http/client@1.0.0' core-imports.txt; then
            echo "unexpected core import" >&2
            exit 1
          fi
          test "$(wc -l < core-imports.txt)" -eq 1
          # Exactly the three exports of the `provider-cli` world, and no ambient import.
          wasm-tools component wit -j gpt-image-provider.wasm > component-wit.json
          jq -e '
            (.worlds | length) == 1 and
            (.worlds[0].imports | length) == 1 and
            ((.worlds[0].exports | keys | sort) == ["describe", "invoke", "run-command"]) and
            (.packages[.interfaces[0].package].name == "dekopon:http@1.0.0")
          ' component-wit.json > /dev/null
          if wasm-tools component wit gpt-image-provider.wasm | grep -Eq 'wasi:'; then
            echo "component exposes an ambient import" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gpt-image-provider.wasm
          path: |
            gpt-image-provider.wasm
            gpt-image-provider.wasm.sha256
