# dekopond — the unprivileged half. It hears the question and asks the model; it decides nothing.
#
# It holds a Slack app token, a Slack bot token, and a model endpoint. It holds no provider
# credential, no policy, and no authorization. Every capability call a session makes is submitted to
# the broker as an on-behalf-of proposal naming the sender's canonical subject, and the broker alone
# turns that subject into a principal.
#
# chmod 0600 dekopond.yaml. Relative paths resolve against this file's own directory.
apiVersion: dekopon.dev/dekopond/v1alpha1

catalogPath: dekopon.yaml

broker:
  # Must be the socketPath from broker.yaml. serverUid is the UID that owns the broker process; the
  # client verifies it before sending anything.
  socketPath: /home/xavier/.local/run/dekopon/broker.sock
  serverUid: 501

transports:
  - name: workspace-slack
    kind: slackSocketMode
    # Environment variable NAMES, never values. Pasting a token here is a startup failure, and a
    # missing variable is reported by name. The Slack app needs `files:write` to upload the image and
    # `files:read` to fetch what the sender attached; a Discord bot needs Attach Files.
    appTokenEnv: DEKOPOND_SLACK_APP_TOKEN
    botTokenEnv: DEKOPOND_SLACK_BOT_TOKEN
    experience: agent
    activity:
      mode: native
      classicFallback: reaction

models:
  - name: local-reasoning
    kind: openaiCompatible
    # Local Ollama. Any OpenAI-compatible chat-completions endpoint works here. The model never sees
    # a provider credential; it only ever writes shell scripts. It must also have a vision modality
    # if you want it to look at what the sender attached before deciding how to remix it.
    endpoint: http://127.0.0.1:11434/v1
    model: qwen3
    timeoutMs: 120000
    classes: [reasoning]

routes:
  - transport: workspace-slack
    match: { kind: directMessage }
    agent: chat-image-studio
    # Both of these land in dekopon 0.13.0, and both are reach: provider bytes going out to a chat,
    # and a sender's attachment bytes going in to an authorized capability. Dekopon's rule is that
    # reach is configured by the owner, per route — so a route without these two keys runs this agent
    # with no way to deliver an image and no way to accept one.
    providerAttachments:
      # One image per reply; the frame budget carries one ~11 MiB attachment and no more.
      maxPerReply: 1
    chatAssetInputs:
      # Only this capability may receive an expanded `chat-asset:<N>`. The gateway substitutes the
      # attachment's bytes as a data URL before proposing, bounded at 3 expansions and 8.5 MiB
      # decoded per invocation, separately from the model's own `fetch_chat_asset` budget.
      - gpt-image.edit
    limits:
      # Drawing is one or two capability calls and a caption. Too much budget loops; one image per
      # call is the point.
      maxSteps: 6
      maxCapabilityCalls: 4
    conversation:
      # Remembered, so "now make it wider" is a question this bot can answer. A 4-minute provider
      # call has to fit inside the turn deadline, which is why the step budget is small.
      mode: persistent
      idleTimeoutMs: 900000
      maxTurns: 12
      maxBytes: 65536

sessions:
  maxConcurrent: 2
  replyOnBusy: true
  maxConversations: 256

# Generation took 23–37 seconds in every measured call and the capability allows 240 seconds, so the
# gateway must be willing to wait out a slow one before it shuts down.
shutdownGraceMs: 300000

# Optional, same shape as broker.yaml's. `telemetryPayloads: true` would add chat text and the
# canonical subject to spans, which declares the sink in scope for every message this gateway sees.
# telemetry:
#   endpoint: http://127.0.0.1:5080/api/default
#   transport: http
#   serviceName: dekopond
#   exportTimeoutMs: 10000
#   telemetryPayloads: false
