[workspace]

[package]
name = "dekopon-gpt-image-provider"
version = "0.6.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "GPT Image generation and editing for Dekopon, billed to a ChatGPT subscription, as a Wasm component"
repository = "https://github.com/dekopon-agents/dekopon-provider-gpt-image"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dekopon-provider-sdk = "=0.42.0"
clap = { version = "=4.6.6", features = ["derive"] }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
base64 = "=0.22.1"
dekopon-provider-sdk-testkit = "=0.42.0"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
