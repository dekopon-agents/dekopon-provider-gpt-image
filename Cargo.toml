[workspace]

[package]
name = "dekopon-gpt-image-provider"
version = "0.5.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "GPT Image generation and editing for Dekopon, billed to a ChatGPT subscription, as a Wasm component"
repository = "https://github.com/dekopon-agents/dekopon-provider-gpt-image"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dekopon-provider-sdk = "=0.33.0"
clap = { version = "=4.6.6", features = ["derive"] }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
dekopon-provider-sdk-testkit = "=0.33.0"

# No base64 crate. This guest needs exactly two things from base64 — that a string is in the
# standard alphabet, and the first twelve bytes of one — and both are a few lines of arithmetic
# over bytes. A decoder in the dependency graph would invite calling it on an 11 MiB blob, which is
# the one thing the memory budget forbids.

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
