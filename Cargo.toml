[workspace]

[package]
name = "dekopon-gpt-image-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "GPT Image generation and editing for Dekopon, billed to a ChatGPT subscription, as a Wasm component"
repository = "https://github.com/dekopon-agents/dekopon-provider-gpt-image"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Exact crates.io pins, never a branch: a `branch =` dependency resolves by fetching the ref, so
# deleting the branch upstream breaks every cold build, which is exactly how the first out-of-tree
# provider rotted. 0.13.0 is the first published SDK carrying `dekopon:provider@0.3.0`, whose
# `provider-cli` world exports `run-command` — the facade that renders `--help` and usage errors in
# the guest — so this provider's world is expressible against a release rather than a commit.
dekopon-provider-http = "=0.13.0"
dekopon-provider-sdk = { version = "=0.13.0", features = ["clap"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# 0.62.0, matching dekopon 0.13.0's own workspace pin: it is the version the SDK and the HTTP
# binding generate their own bindings with, and two wit-bindgen runtimes in one component define
# `cabi_realloc` twice. It moves in lockstep with rust-toolchain.toml and the wasm-tools pin in
# build.sh and scripts/validate.sh, because wit-bindgen's generated code must agree with the
# wasm-tools CLI.
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc"] }

# No base64 crate. This guest needs exactly two things from base64 — that a string is in the
# standard alphabet, and the first twelve bytes of one — and both are a few lines of arithmetic
# over bytes. A decoder in the dependency graph would invite calling it on an 11 MiB blob, which is
# the one thing the memory budget forbids.

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
